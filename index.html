<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6c5ce7">
<title>学マス コンテスト育成計算機</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family:
            -apple-system, BlinkMacSystemFont,
            "Hiragino Kaku Gothic ProN", "Yu Gothic",
            Meiryo, sans-serif;
        background: linear-gradient(135deg, #f5f3ff, #eef7ff);
        color: #333;
        min-height: 100vh;
    }

    .container {
        width: 100%;
        max-width: 520px;
        margin: 0 auto;
        padding: 20px 14px 40px;
    }

    h1 {
        font-size: 22px;
        text-align: center;
        margin: 4px 0 6px;
        color: #4b3ca7;
    }

    .description {
        text-align: center;
        font-size: 13px;
        color: #777;
        margin-bottom: 18px;
        line-height: 1.6;
    }

    .switch-area {
        display: flex;
        background: #ddd9f5;
        border-radius: 14px;
        padding: 4px;
        margin-bottom: 16px;
    }

    .switch-btn {
        flex: 1;
        border: none;
        background: transparent;
        padding: 12px 8px;
        border-radius: 11px;
        font-size: 15px;
        font-weight: bold;
        color: #625c7a;
        cursor: pointer;
        transition: 0.2s;
    }

    .switch-btn.active {
        background: white;
        color: #5b48c7;
        box-shadow: 0 2px 7px rgba(0,0,0,0.1);
    }

    .card {
        background: white;
        border-radius: 18px;
        padding: 18px;
        margin-bottom: 14px;
        box-shadow: 0 4px 18px rgba(70,60,120,0.08);
    }

    .card-title {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
    }

    .card-title h2 {
        font-size: 18px;
        margin: 0;
        color: #443b75;
    }

    .badge {
        font-size: 11px;
        padding: 4px 8px;
        border-radius: 8px;
        background: #eeeaff;
        color: #6353c8;
        font-weight: bold;
    }

    .stat-row {
        display: grid;
        grid-template-columns: 48px 1fr 70px;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
    }

    .stat-name {
        font-weight: bold;
        font-size: 16px;
    }

    .stat-name.vo {
        color: #e85b6b;
    }

    .stat-name.da {
        color: #4f8fe8;
    }

    .stat-name.vi {
        color: #e29a24;
    }

    input[type="number"] {
        width: 100%;
        border: 2px solid #e3e0ed;
        border-radius: 10px;
        padding: 10px;
        font-size: 17px;
        text-align: right;
        outline: none;
        background: #fafafa;
        -webkit-appearance: none;
    }

    input[type="number"]:focus {
        border-color: #7765dc;
        background: white;
    }

    input[type="number"]:disabled {
        background: #f2f1f6;
        color: #777;
    }


    .limit-area {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 14px;
        padding: 10px 12px;
        background: #f7f6fb;
        border-radius: 12px;
    }

    .limit-label {
        font-size: 13px;
        font-weight: bold;
        color: #555;
        white-space: nowrap;
    }

    .limit-select {
        flex: 1;
        max-width: 180px;
        border: 2px solid #e3e0ed;
        border-radius: 10px;
        padding: 9px 10px;
        font-size: 14px;
        background: white;
        color: #444;
        outline: none;
    }

    .limit-select:focus {
        border-color: #7765dc;
    }

    .max-label {
        text-align: right;
        font-size: 12px;
        color: #999;
    }

    .result {
        border-radius: 12px;
        padding: 10px 12px;
        background: #f7f6fb;
        margin-top: 4px;
        font-size: 13px;
        color: #666;
    }

    .result strong {
        color: #4d3db0;
        font-size: 16px;
    }

    .total {
        margin-top: 5px;
        font-size: 12px;
        color: #777;
    }

    .total .number {
        font-weight: bold;
        color: #555;
    }

    .total.over .number {
        color: #e04455;
    }

    .formula {
        background: #fff;
        border-radius: 14px;
        padding: 14px;
        margin-top: 14px;
        font-size: 12px;
        line-height: 1.8;
        color: #666;
    }

    .formula-title {
        font-weight: bold;
        color: #5144a0;
        margin-bottom: 4px;
    }

    .footer {
        text-align: center;
        color: #aaa;
        font-size: 11px;
        margin-top: 20px;
    }

    @media (max-width: 380px) {
        .container {
            padding-left: 10px;
            padding-right: 10px;
        }

        .stat-row {
            grid-template-columns: 42px 1fr 58px;
            gap: 7px;
        }

        input[type="number"] {
            font-size: 16px;
        }
    }
</style>
</head>

<body>

<div class="container">

    <h1>学マス コンテスト育成計算機</h1>

    <div class="description">
        表と裏のメモリーを組み合わせたときの<br>
        必要なステータスを計算します。
    </div>

    <div class="switch-area">
        <button id="frontMode"
                class="switch-btn active"
                onclick="setMode('front')">
            表 → 裏
        </button>

        <button id="backMode"
                class="switch-btn"
                onclick="setMode('back')">
            裏 → 表
        </button>
    </div>

    <div id="memoryCards">
    <!-- 表 -->
    <div id="frontCard" class="card">
        <div class="card-title">
            <h2>表メモリー</h2>
            <span id="frontBadge" class="badge">入力</span>
        </div>
        <div class="limit-area">
            <span class="limit-label">上限</span>
            <select id="frontLimit" class="limit-select" onchange="calculate()">
                <option value="3200">HIF（3200）</option>
                <option value="3000">初レジェ（3000）</option>
            </select>
        </div>

        <div class="stat-row">
            <div class="stat-name vo">Vo</div>
            <input id="frontVo"
                   type="number"
                   min="0"
                   max="3200"
                   value="0"
                   oninput="calculate()">
            <div class="max-label" id="frontVoMax">0～3200</div>
        </div>

        <div class="stat-row">
            <div class="stat-name da">Da</div>
            <input id="frontDa"
                   type="number"
                   min="0"
                   max="3200"
                   value="0"
                   oninput="calculate()">
            <div class="max-label" id="frontDaMax">0～3200</div>
        </div>

        <div class="stat-row">
            <div class="stat-name vi">Vi</div>
            <input id="frontVi"
                   type="number"
                   min="0"
                   max="3200"
                   value="0"
                   oninput="calculate()">
            <div class="max-label" id="frontViMax">0～3200</div>
        </div>
    </div>

    <!-- 裏 -->
    <div id="backCard" class="card">
        <div class="card-title">
            <h2>裏メモリー</h2>
            <span id="backBadge" class="badge">自動計算</span>
        </div>
        <div class="limit-area">
            <span class="limit-label">上限</span>
            <select id="backLimit" class="limit-select" onchange="calculate()">
                <option value="3200">HIF（3200）</option>
                <option value="3000">初レジェ（3000）</option>
            </select>
        </div>

        <div class="stat-row">
            <div class="stat-name vo">Vo</div>
            <input id="backVo"
                   type="number"
                   min="0"
                   max="3200"
                   value="0"
                   oninput="calculate()">
            <div class="max-label" id="backVoMax">0～3200</div>
        </div>

        <div class="stat-row">
            <div class="stat-name da">Da</div>
            <input id="backDa"
                   type="number"
                   min="0"
                   max="3200"
                   value="0"
                   oninput="calculate()">
            <div class="max-label" id="backDaMax">0～3200</div>
        </div>

        <div class="stat-row">
            <div class="stat-name vi">Vi</div>
            <input id="backVi"
                   type="number"
                   min="0"
                   max="3200"
                   value="0"
                   oninput="calculate()">
            <div class="max-label" id="backViMax">0～3200</div>
        </div>
    </div>
    </div>

    <div class="formula">
        <div class="formula-title">計算式</div>
        最終ステータス = <b>表 +（裏 ÷ 5）</b><br>
        最終ステータスの上限は <b>3360</b>。<br>
        表 → 裏：<b>裏 = min(裏メモリー上限, floor((3360 − 表) × 5))</b><br>
        裏 → 表：<b>表 = min(表メモリー上限, floor(3360 − 裏 ÷ 5))</b>
    </div>

    <div class="footer">
        学マス コンテスト育成計算機
    </div>

</div>

<script>
let mode = "front";

function getFrontLimit() {
    return Number(document.getElementById("frontLimit").value);
}

function getBackLimit() {
    return Number(document.getElementById("backLimit").value);
}

function clamp(value, max) {
    value = Number(value) || 0;
    return Math.max(0, Math.min(max, Math.floor(value)));
}

function updateLimitDisplay() {
    const frontLimit = getFrontLimit();
    const backLimit = getBackLimit();

    ["frontVo", "frontDa", "frontVi"].forEach(id => {
        document.getElementById(id).max = frontLimit;
    });
    ["backVo", "backDa", "backVi"].forEach(id => {
        document.getElementById(id).max = backLimit;
    });

    ["frontVoMax", "frontDaMax", "frontViMax"].forEach(id => {
        document.getElementById(id).textContent = `0～${frontLimit}`;
    });
    ["backVoMax", "backDaMax", "backViMax"].forEach(id => {
        document.getElementById(id).textContent = `0～${backLimit}`;
    });
}

function calcBack(front) {
    return Math.max(
        0,
        Math.min(
            getBackLimit(),
            Math.floor((3360 - front) * 5)
        )
    );
}

function calcFront(back) {
    return Math.max(
        0,
        Math.min(
            getFrontLimit(),
            Math.floor(3360 - back / 5)
        )
    );
}

function calculateFromFront() {
    const frontLimit = getFrontLimit();

    const frontVo = clamp(document.getElementById("frontVo").value, frontLimit);
    const frontDa = clamp(document.getElementById("frontDa").value, frontLimit);
    const frontVi = clamp(document.getElementById("frontVi").value, frontLimit);

    document.getElementById("frontVo").value = frontVo;
    document.getElementById("frontDa").value = frontDa;
    document.getElementById("frontVi").value = frontVi;

    document.getElementById("backVo").value = calcBack(frontVo);
    document.getElementById("backDa").value = calcBack(frontDa);
    document.getElementById("backVi").value = calcBack(frontVi);
}

function calculateFromBack() {
    const backLimit = getBackLimit();

    const backVo = clamp(document.getElementById("backVo").value, backLimit);
    const backDa = clamp(document.getElementById("backDa").value, backLimit);
    const backVi = clamp(document.getElementById("backVi").value, backLimit);

    document.getElementById("backVo").value = backVo;
    document.getElementById("backDa").value = backDa;
    document.getElementById("backVi").value = backVi;

    document.getElementById("frontVo").value = calcFront(backVo);
    document.getElementById("frontDa").value = calcFront(backDa);
    document.getElementById("frontVi").value = calcFront(backVi);
}

function calculate() {
    updateLimitDisplay();

    if (mode === "front") {
        calculateFromFront();
    } else {
        calculateFromBack();
    }
}


function updateCardOrder() {
    const container = document.getElementById("memoryCards");
    const frontCard = document.getElementById("frontCard");
    const backCard = document.getElementById("backCard");

    if (!container || !frontCard || !backCard) return;

    if (mode === "front") {
        container.appendChild(frontCard);
        container.appendChild(backCard);
    } else {
        container.appendChild(backCard);
        container.appendChild(frontCard);
    }
}

function setMode(newMode) {
    mode = newMode;
    updateCardOrder();

    const frontInputs = [
        document.getElementById("frontVo"),
        document.getElementById("frontDa"),
        document.getElementById("frontVi")
    ];

    const backInputs = [
        document.getElementById("backVo"),
        document.getElementById("backDa"),
        document.getElementById("backVi")
    ];

    if (mode === "front") {
        document.getElementById("frontMode").classList.add("active");
        document.getElementById("backMode").classList.remove("active");

        document.getElementById("frontBadge").textContent = "入力";
        document.getElementById("backBadge").textContent = "自動計算";

        frontInputs.forEach(input => input.disabled = false);
        backInputs.forEach(input => input.disabled = true);

        calculateFromFront();
    } else {
        document.getElementById("frontMode").classList.remove("active");
        document.getElementById("backMode").classList.add("active");

        document.getElementById("frontBadge").textContent = "自動計算";
        document.getElementById("backBadge").textContent = "入力";

        frontInputs.forEach(input => input.disabled = true);
        backInputs.forEach(input => input.disabled = false);

        calculateFromBack();
    }

    updateLimitDisplay();
}

setMode("front");
</script>

</body>
</html>
